<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena de Luta</title>
<style>
:root{--bg:#f3f6f8;--fg:#14202a;--card:#fff;--line:#c9d6de;--ac:#e8472b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--fg:#eaf0f4;--card:#1a242c;--line:#2d3b46}}
:root[data-theme="dark"]{--bg:#10171d;--fg:#eaf0f4;--card:#1a242c;--line:#2d3b46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;max-width:460px;margin-inline:auto}
h1{font:800 22px/1.1 system-ui,sans-serif;margin:4px 0 10px}
canvas{width:100%;aspect-ratio:1;background:#23a3cf;border:6px solid #000;border-radius:2px;display:block;box-sizing:border-box}
.row{display:flex;gap:8px;margin:10px 0}
select,input[type=text],button{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);min-width:0}
select{flex:1}
button{background:var(--ac);color:#fff;border:0;font-weight:700}
#msg{min-height:26px;font-weight:800;text-align:center;font-size:18px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
summary{font-weight:700}
label{display:block;margin:8px 0 2px;font-size:13px}
input[type=file]{width:100%}
</style></head><body>
<h1>Arena de Luta</h1>
<canvas id="cv" width="400" height="400"></canvas>
<div id="msg"></div>
<div class="row"><select id="sa"></select><select id="sb"></select></div>
<div class="row"><button id="go" style="flex:1">Lutar</button></div>
<details open><summary>Criar personagem</summary>
<label>Chave do Gemini</label><input type="password" id="gk" style="width:100%">
<label>Chave do Pixabay</label><input type="password" id="pk" style="width:100%">
<label>Descreva o personagem e a habilidade</label><input type="text" id="gp" placeholder="ex: boxeador que fica mais rápido a cada soco" style="width:100%">
<div class="row"><button id="mk" style="flex:1">Criar personagem (fotos + habilidade)</button></div>
<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
<b>Ou use suas fotos</b>
<p style="font-size:13px;margin:6px 0">Nomeie assim: padre_idle.png e padre_atk.png. Com uma foto só, o jogo faz a pose de ataque. A habilidade vem da descrição acima (precisa da chave do Gemini).</p>
<input type="file" id="fi" accept="image/*" multiple>
<div class="row"><button id="add" style="flex:1">Adicionar</button><button id="clr" style="background:var(--card);color:var(--fg);border:1px solid var(--line)">Apagar meus</button></div>
<div id="st" style="font-size:13px;margin-top:6px"></div></details>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),g=cv.getContext('2d'),S=400,R=42;
const AB={choque:'⚡ Choque: +50% dano e atordoa',bomba:'💣 Bomba: mata quando o tempo acaba',cura:'💚 Cura: rouba vida ao bater',investida:'💨 Investida: fica mais rápido',escudo:'🛡️ Escudo: leva 35% menos dano'};
const chars=[
{n:'Boxeador',i:'🥊',a:'🤜',ab:'investida'},
{n:'Padre',i:'🙏',a:'✝️',ab:'cura'},
{n:'Cavaleiro',i:'🛡️',a:'⚔️',ab:'escudo'},
{n:'Raquete',i:'🎾',a:'⚡',ab:'choque'},
{n:'Homem-bomba',i:'🧨',a:'💥',ab:'bomba'}];
function fill(){[$('sa'),$('sb')].forEach((s,k)=>{const v=s.value||(k?1:0);s.innerHTML=chars.map((c,i)=>`<option value="${i}">${c.n} (${typeof c.ab=='string'?c.ab:'IA'})</option>`).join('');s.value=v});}
fill();$('sb').value=4;
const rd=f=>new Promise(r=>{if(!f)return r(null);const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>r(im);im.src=fr.result};fr.readAsDataURL(f)});
const ld=u=>new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.src=u});
const save=()=>{try{localStorage.setItem('arena-chars',JSON.stringify(chars.filter(c=>c.u).map(c=>c.u)))}catch(e){$('msg').textContent='Sem espaço pra salvar'}};
function cut(im){const k=Math.min(1,260/im.height),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);
const d=x.getImageData(0,0,w,h),p=d.data,px=(a,b)=>(b*w+a)*4;
const cs=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([a,b])=>{const q=px(a,b);return[p[q],p[q+1],p[q+2],p[q+3]]});
if(cs.some(q=>q[3]<200))return c.toDataURL();
const m=[0,1,2].map(j=>cs.reduce((s,q)=>s+q[j],0)/4),T=60;
if(cs.some(q=>Math.hypot(q[0]-m[0],q[1]-m[1],q[2]-m[2])>T))return c.toDataURL();
const ok=q=>Math.hypot(p[q]-m[0],p[q+1]-m[1],p[q+2]-m[2])<T&&p[q+3]>0,st=[];
for(let a=0;a<w;a++)st.push(a,0,a,h-1);for(let b=0;b<h;b++)st.push(0,b,w-1,b);
while(st.length){const b=st.pop(),a=st.pop();if(a<0||b<0||a>=w||b>=h)continue;const q=px(a,b);if(!ok(q))continue;p[q+3]=0;st.push(a+1,b,a-1,b,a,b+1,a,b-1)}
x.putImageData(d,0,0);return c.toDataURL()}
$('clr').onclick=()=>{try{localStorage.removeItem('arena-chars')}catch(e){}chars.splice(5);fill();$('msg').textContent='Personagens apagados'};
(async()=>{try{for(const u of JSON.parse(localStorage.getItem('arena-chars')||'[]'))chars.push({n:u.n,ab:u.ab,i:await ld(u.i),a:await ld(u.a),u,auto:u.i===u.a});fill()}catch(e){}})();
let F=[],pop=[],PR=[],run=false,looping=false,last=0;
const mk=(c,x,y,vx,vy)=>({c,x,y,vx,vy,hp:1000,t:0,stun:0,cd:0,e:eff(c),bomb:eff(c).timer||0,pz:0,pd:0,fire:2,tp:4,h:(eff(c).code?comp(eff(c).code):0)||{},s:{}});
$('go').onclick=()=>{F=[mk(chars[$('sa').value],110,110,150,110),mk(chars[$('sb').value],290,290,-140,-120)];pop=[];PR=[];F.forEach((f,i)=>call(f,'onStart',F[1-i]));run=true;$('msg').textContent='';last=performance.now();if(!looping){looping=true;requestAnimationFrame(loop)}};
function end(w){run=false;$('msg').textContent='🏆 '+w.c.n+' venceu!'}
function hit(a,b){const e=a.e;let d=(60+Math.random()*40)*(e.dmg||1);const cr=Math.random()<(e.crit||0);if(cr)d*=2;
if(e.stun)b.stun=Math.max(b.stun,e.stun);
if(e.steal)a.hp=Math.min(1000,a.hp+e.steal);
if(e.accel){a.vx*=e.accel;a.vy*=e.accel}
if(e.poison){b.pz=3;b.pd=e.poison}
let m=call(a,'onHit',b,d);if(typeof m=='number')d=m;m=call(b,'onHurt',a,d);if(typeof m=='number')d=m;d=Math.round(d*(1-(b.e.armor||0)));b.hp-=d;a.t=.35;
if(b.e.thorns)a.hp-=Math.round(d*b.e.thorns);
pop.push({x:b.x+20,y:b.y-60,s:(cr?'CRIT -':'-')+d,l:1,c:cr?'#ff5a2a':e.stun?'#ffe600':'#fff'})}
function hitP(q,b){const d=Math.round((q.d==null?55:q.d)*(1-(b.e.armor||0)));b.hp-=d;pop.push({x:b.x+20,y:b.y-60,s:'-'+d,l:1,c:'#fff'});if(q.f)try{q.f(q.o,b)}catch(x){}}
function upd(dt){F.forEach((f,i)=>{const o=F[1-i];f.t-=dt;f.cd-=dt;
if(f.stun>0)f.stun-=dt;else{f.x+=f.vx*dt;f.y+=f.vy*dt}
if(f.x<R){f.x=R;f.vx=Math.abs(f.vx)}if(f.x>S-R){f.x=S-R;f.vx=-Math.abs(f.vx)}
if(f.y<R+30){f.y=R+30;f.vy=Math.abs(f.vy)}if(f.y>S-R){f.y=S-R;f.vy=-Math.abs(f.vy)}
const sp=Math.hypot(f.vx,f.vy);if(sp>420){f.vx*=420/sp;f.vy*=420/sp}
if(run){const e=f.e;
if(e.timer){f.bomb-=dt;if(f.bomb<=0){o.hp=0;pop.push({x:o.x,y:o.y,s:'BOOM!',l:1.5,c:'#ff5a2a'})}}
if(f.pz>0){f.pz-=dt;f.hp-=f.pd*dt}
if(e.proj){f.fire-=dt;if(f.fire<=0){f.fire=e.proj;const dx=o.x-f.x,dy=o.y-f.y,m=Math.hypot(dx,dy)||1;PR.push({x:f.x,y:f.y,vx:dx/m*320,vy:dy/m*320,o:f,l:3})}}
if(e.tp){f.tp-=dt;if(f.tp<=0){f.tp=e.tp;f.x=60+Math.random()*(S-120);f.y=100+Math.random()*(S-160)}}call(f,'onTick',o,dt)}});
const[a,b]=F,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
if(d<R*2){const nx=dx/d,ny=dy/d,p=(R*2-d)/2;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;
const rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
if(rv>0){a.vx-=rv*nx;a.vy-=rv*ny;b.vx+=rv*nx;b.vy+=rv*ny}
if(a.cd<=0&&b.cd<=0){hit(a,b);hit(b,a);a.cd=b.cd=.5}}
PR.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;const t=F[0]==q.o?F[1]:F[0];if(Math.hypot(t.x-q.x,t.y-q.y)<R+(q.r||7)){q.l=0;hitP(q,t)}});PR=PR.filter(q=>q.l>0);
pop.forEach(p=>{p.y-=25*dt;p.l-=dt});pop=pop.filter(p=>p.l>0);
if(run){if(a.hp<=0)end(b);else if(b.hp<=0)end(a)}}
function spr(f){const s=f.t>0?f.c.a:f.c.i;g.save();g.translate(f.x,f.y);
if(f.stun>0)g.translate(Math.random()*4-2,0);
if(f.t>0&&f.c.auto){const o=F[0]==f?F[1]:F[0],dr=o.x>f.x?1:-1,k=Math.sin(Math.PI*Math.max(0,f.t)/.35);g.translate(dr*k*16,-k*4);g.rotate(dr*k*.28);g.scale(1+k*.12,1+k*.12)}
if(typeof s=='string'){g.font='72px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s,0,0)}
else{const h=f.t>0&&!f.c.auto?110:96,w=h*s.width/s.height;g.drawImage(s,-w/2,-h/2,w,h)}
g.restore();
if(f.t>.15&&f.c.auto){const o=F[0]==f?F[1]:F[0],mx=(f.x+o.x)/2,my=(f.y+o.y)/2;g.strokeStyle='#ffe600';g.lineWidth=4;for(let n=0;n<8;n++){const a=n*Math.PI/4;g.beginPath();g.moveTo(mx+Math.cos(a)*10,my+Math.sin(a)*10);g.lineTo(mx+Math.cos(a)*30,my+Math.sin(a)*30);g.stroke()}}
const x=f.x,y=f.y-R-30;g.fillStyle='#fff';g.strokeStyle='#555';g.lineWidth=2;
g.fillRect(x-9,y-26,18,56);g.fillRect(x-26,y-12,52,24);g.strokeRect(x-9,y-26,18,56);
g.fillStyle='#fff';g.fillRect(x-24,y-10,48,20);
g.fillStyle='#444';g.font='bold 17px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(Math.max(0,Math.round(f.hp)),x,y);
if(f.e.timer){g.fillStyle='#200';g.fillRect(f.x-34,f.y+R,68,22);g.fillStyle='#f22';g.font='bold 16px monospace';g.fillText(Math.max(0,f.bomb).toFixed(2),f.x,f.y+R+11)}}
function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;
if(F.length&&(run||pop.length)){upd(dt)}
g.clearRect(0,0,S,S);F.forEach(spr);PR.forEach(q=>{g.fillStyle=q.c||'#ffe600';g.beginPath();g.arc(q.x,q.y,q.r||7,0,7);g.fill()});
pop.forEach(p=>{g.globalAlpha=Math.min(1,p.l);g.fillStyle=p.c;g.font='bold 22px sans-serif';g.textAlign='center';g.fillText(p.s,p.x,p.y)});g.globalAlpha=1;
requestAnimationFrame(loop)}
const PRE={choque:{dmg:1.5,stun:.6},bomba:{dmg:.4,timer:15},cura:{steal:40},investida:{accel:1.12},escudo:{armor:.35}};
const eff=c=>typeof c.ab=='string'?PRE[c.ab]:c.ab;
const PROMPT=`Você cria habilidades para um jogo de luta em arena (400x400) onde dois lutadores quicam pelas paredes e causam dano ao encostar (cada um começa com 1000 de vida). Responda SÓ JSON: {"nome":"nome curto","desc":"1 frase","termo":"termo de busca de foto stock em inglês","code":"corpo de função JavaScript"}. O código é o corpo de uma função que recebe "api" e DEVE terminar com return {onStart(me,foe){}, onTick(me,foe,dt){}, onHit(me,foe,dmg){}, onHurt(me,foe,dmg){}}, todos opcionais. onHit roda quando me bate em foe; onHurt roda quando me apanha; ambos podem retornar um novo valor de dano. Lutadores têm x, y, vx, vy (pixels por segundo), hp, stun e s (objeto livre pra guardar variáveis). onTick roda todo frame (dt em segundos); use me.s pra contar tempo. API: api.say(texto,x,y,cor), api.damage(alvo,n), api.heal(alvo,n), api.stun(alvo,seg), api.push(alvo,vx,vy), api.speed(alvo,fator), api.tp(alvo,x,y), api.poison(alvo,dano_por_seg,seg), api.shoot(me,foe,{dmg,speed,r,color,life,onHit(me,alvo){}}), api.rnd(). Sem loops infinitos, sem async, sem window nem document. Seja criativo e fiel ao pedido, mas equilibrado, com no máximo 40 linhas. Pedido do jogador: `;
async function model(k){if(gm.v)return gm.v;try{const j=await(await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(k))).json();
const l=j.models.filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/flash/.test(m.name)&&!/lite|image|tts|live|audio|preview|exp|thinking/.test(m.name)).map(m=>m.name).sort((a,b)=>a.localeCompare(b,'en',{numeric:true}));
gm.v=l.pop()||'models/gemini-2.5-flash'}catch(e){gm.v='models/gemini-2.5-flash'}return gm.v}
const api={say:(t,x,y,c)=>pop.push({x,y,s:String(t).slice(0,20),l:1,c:c||'#fff'}),
damage:(t,n)=>{t.hp-=Math.max(0,+n||0)},heal:(t,n)=>{t.hp=Math.min(1000,t.hp+Math.max(0,+n||0))},
stun:(t,v)=>{t.stun=Math.max(t.stun,Math.min(3,+v||0))},push:(t,vx,vy)=>{t.vx=+vx||0;t.vy=+vy||0},
speed:(t,k)=>{t.vx*=k;t.vy*=k},tp:(t,x,y)=>{t.x=Math.min(S-45,Math.max(45,+x||200));t.y=Math.min(S-45,Math.max(75,+y||200))},
poison:(t,d,v)=>{t.pd=+d||0;t.pz=Math.min(10,+v||0)},rnd:Math.random,
shoot:(me,foe,o)=>{o=o||{};const dx=foe.x-me.x,dy=foe.y-me.y,m=Math.hypot(dx,dy)||1,sp=Math.min(600,o.speed||320);PR.push({x:me.x,y:me.y,vx:dx/m*sp,vy:dy/m*sp,o:me,l:o.life||3,d:o.dmg,c:o.color,r:Math.min(30,o.r||7),f:o.onHit})}};
function comp(code){try{return new Function('api','window','document','localStorage','sessionStorage','fetch','globalThis','self','XMLHttpRequest','"use strict";'+code)(api)||{}}catch(x){return null}}
function call(f,n,...a){try{const h=f.h&&f.h[n];if(typeof h=='function')return h(f,...a)}catch(x){if(!call.w){call.w=1;$('msg').textContent='Erro na habilidade de '+f.c.n+': '+x.message}}}

const gm={},st=t=>{$('st').textContent=t},gk=()=>$('gk').value.trim(),pkey=()=>$('pk').value.trim();
['gk','pk'].forEach(i=>{try{$(i).value=localStorage.getItem('arena-'+i)||''}catch(e){}$(i).onchange=()=>{try{localStorage.setItem('arena-'+i,$(i).value.trim())}catch(e){}}});
async function gem(parts){const k=gk(),m=await model(k),r=await fetch('https://generativelanguage.googleapis.com/v1beta/'+m+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json'}})});
const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);
return JSON.parse(j.candidates[0].content.parts[0].text.replace(/```json|```/g,'').trim())}
async function genAbility(t){const o=await gem([{text:PROMPT+t}]);if(typeof o.code!='string'||!comp(o.code))throw new Error('código inválido, tente de novo');return o}
const loadImg=u=>new Promise((ok,no)=>{const x=new Image();x.crossOrigin='anonymous';x.onload=()=>ok(x);x.onerror=no;x.src=u});
async function b64(u){const b=await(await fetch(u)).blob();return new Promise(ok=>{const f=new FileReader();f.onload=()=>ok({inline_data:{mime_type:b.type||'image/jpeg',data:f.result.split(',')[1]}});f.readAsDataURL(b)})}
async function addChar(n,ui,ua,ab){const u={n,i:ui,a:ua,ab};chars.push({n,ab,i:await ld(ui),a:await ld(ua),u,auto:ui===ua});save();fill();$('sa').value=chars.length-1}
$('mk').onclick=async()=>{const t=$('gp').value.trim();if(!gk()||!pkey()||!t){st('Preencha as duas chaves e a descrição');return}
$('mk').disabled=true;
try{st('1/4 Criando a habilidade...');const o=await genAbility(t);
st('2/4 Buscando fotos...');const j=await(await fetch('https://pixabay.com/api/?key='+encodeURIComponent(pkey())+'&q='+encodeURIComponent(o.termo||t)+'&colors=transparent&per_page=100&safesearch=true')).json();
const H=j.hits||[];if(!H.length)throw new Error('nenhuma foto para "'+(o.termo||t)+'"');
const G={};H.forEach(h=>(G[h.user_id]=G[h.user_id]||[]).push(h));
const L=Object.values(G).sort((x,y)=>y.length-x.length).flat().slice(0,12);
let ii=0,ai=L[1]&&L[1].user_id==L[0].user_id?1:0;
if(L.length>1){st('3/4 Escolhendo as fotos...');try{const ps=[{text:'Imagens numeradas de 0 a '+(L.length-1)+', na ordem. Personagem pedido: '+t+'. Escolha "i" (o personagem parado, pose neutra) e "a" (a MESMA pessoa ou personagem em pose de ataque ou ação; se nenhuma for da mesma pessoa, use o mesmo número de i). Responda só JSON: {"i":n,"a":n}.'}];
for(const h of L)ps.push(await b64(h.previewURL));
const c=await gem(ps);ii=+c.i||0;ai=c.a==null?ii:+c.a||0}catch(e){}}
const cl=v=>Math.min(Math.max(v|0,0),L.length-1);ii=cl(ii);ai=cl(ai);
st('4/4 Montando o personagem...');
const hi=L[ii],ha=L[ai],ui=cut(await loadImg(hi.webformatURL||hi.largeImageURL)),ua=ha===hi?ui:cut(await loadImg(ha.webformatURL||ha.largeImageURL));
await addChar(o.nome||'Novo',ui,ua,{code:o.code});
st('Pronto: '+(o.nome||'Novo')+' - '+(o.desc||'')+(ua===ui?' (uma foto só: o jogo faz a pose de ataque)':''))}
catch(e){st('Erro: '+e.message)}$('mk').disabled=false};
$('add').onclick=async()=>{const fs=[...$('fi').files];if(!fs.length){st('Escolha as fotos');return}
try{let ab={};const t=$('gp').value.trim();if(t&&gk()){st('Criando a habilidade...');ab={code:(await genAbility(t)).code}}
const G={};fs.forEach(f=>{const b=f.name.replace(/\.[^.]+$/,''),m=b.match(/^(.+?)[_\- ]*(idle|parado|atk|ataque|atacando)$/i),n=m?m[1]:b,atk=m&&/atk|ataque|atacando/i.test(m[2]);(G[n]=G[n]||{})[atk?'a':'i']=f});
let c=0;for(const n in G){const o=G[n],f1=o.i||o.a,f2=o.a||o.i,ui=cut(await rd(f1)),ua=f2===f1?ui:cut(await rd(f2));await addChar(n,ui,ua,ab);c++}
st(c+' personagem(ns) adicionado(s)')}catch(e){st('Erro: '+e.message)}};
</script></body></html>
